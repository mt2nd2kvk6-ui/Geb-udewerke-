<title>Gebäudewerke Neuauftritt</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Schlanke Übersicht: nur Bilder und Links, keine Rahmen, keine externen Schriften. */
:root{--bg:#F3F5F8;--fg:#0B1F38;--leise:#4A5A6C;--knopf:#0D2B4F;--knopf-text:#FFFFFF;--linie:#D3DAE3}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#08162A;--fg:#E8EEF5;--leise:#A3B1C2;--knopf:#FFD21E;--knopf-text:#0B1F38;--linie:#22344D;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#08162A;--fg:#E8EEF5;--leise:#A3B1C2;--knopf:#FFD21E;--knopf-text:#0B1F38;--linie:#22344D;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
main{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 64px}
h1{font-size:clamp(30px,6vw,52px);line-height:1;letter-spacing:-.03em;margin:8px 0 28px;text-wrap:balance}
section{margin:0 0 44px;padding-top:18px;border-top:2px solid var(--fg)}
h2{font-size:22px;margin:0 0 12px}
img{width:100%;height:auto;display:block;border-radius:10px}
.knoepfe{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;margin-top:14px}
.knopf{display:inline-block;background:var(--knopf);color:var(--knopf-text);text-decoration:none;font-weight:700;padding:12px 18px;border-radius:999px}
.knoepfe a:not(.knopf){color:var(--leise);font-size:14.5px}
a:focus-visible{outline:3px solid #F0B323;outline-offset:3px}
</style>
